version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  google_sign_in: ^7.2.0
  http: ^1.6.0
  sqflite: ^2.3.0
